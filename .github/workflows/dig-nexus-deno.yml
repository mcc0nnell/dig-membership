name: DIG Nexus Deno compatibility
on:
  push:
    paths:
      - 'nexus/api/**'
      - '.github/workflows/dig-nexus-deno.yml'
  pull_request:
    paths:
      - 'nexus/api/**'
      - '.github/workflows/dig-nexus-deno.yml'
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Run Deno compatibility tests
        run: deno test --no-check --allow-net=127.0.0.1 nexus/api/*.deno.test.mjs
