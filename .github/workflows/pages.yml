name: Publish offline membership demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish static demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium with Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Test offline demo JavaScript and prohibited network usage
        run: node --test demo/*.test.cjs
      - name: Test actual offline journeys and automated accessibility in Chromium
        run: npx playwright test -c demo/playwright.config.mjs
      - name: Build static site from demo only
        run: |
          mkdir -p _site
          cp demo/offline.html _site/index.html
          cp demo/atlas.html _site/atlas.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/atlas.html
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 3
          ! grep -Eq '<script[^>]+src=|fetch\(|XMLHttpRequest|localStorage|sessionStorage' _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
