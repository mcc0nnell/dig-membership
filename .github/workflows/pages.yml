name: Publish offline membership demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/offline.html'
      - 'demo/offline.test.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish static demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline demo
        run: node --test demo/offline.test.cjs
      - name: Build static site from demo only
        run: |
          mkdir -p _site
          cp demo/offline.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
