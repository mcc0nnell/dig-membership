name: DIG Nexus PostgreSQL schema validation
on:
  push:
    paths:
      - 'nexus/*.sql'
      - 'nexus/tests/*.sql'
      - 'nexus/tests/*.sh'
      - 'newsletter/*.sql'
      - '.github/workflows/dig-nexus-postgres.yml'
  pull_request:
    paths:
      - 'nexus/*.sql'
      - 'nexus/tests/*.sql'
      - 'nexus/tests/*.sh'
      - 'newsletter/*.sql'
      - '.github/workflows/dig-nexus-postgres.yml'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: dig_nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dig_nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: dig_nexus
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply ordered schemas
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f nexus/schema.sql
          psql -v ON_ERROR_STOP=1 -f nexus/schema-002-lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f nexus/schema-003-identities.sql
          psql -v ON_ERROR_STOP=1 -f nexus/schema-004-registration.sql
          psql -v ON_ERROR_STOP=1 -f nexus/schema-005-conference.sql
          psql -v ON_ERROR_STOP=1 -f nexus/schema-006-organizer.sql
          psql -v ON_ERROR_STOP=1 -f nexus/schema-007-attendee.sql
          psql -v ON_ERROR_STOP=1 -f nexus/schema-008-cloud-run-state.sql
          psql -v ON_ERROR_STOP=1 -f nexus/schema-009-ticketing.sql
          psql -v ON_ERROR_STOP=1 -f newsletter/schema.sql
          psql -v ON_ERROR_STOP=1 -f newsletter/schema-002-unsubscribe.sql
      - name: Verify tables and constraints
        run: |
          set -euo pipefail
          test "$(psql -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('nexus_members','nexus_membership_terms','nexus_communication_preferences','nexus_event_checkins','newsletter_subscribers','newsletter_unsubscribe_tokens')")" = "6"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO nexus_members(email,display_name) VALUES ('tester@example.invalid','Synthetic Tester');"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO nexus_members(email,display_name) VALUES ('TESTER@example.invalid','Duplicate');"; then
            echo "Expected case-insensitive email uniqueness failure" >&2
            exit 1
          fi

      - name: Verify NTC conference isolation and constraints
        run: |
          set -euo pipefail
          test "$(psql -At -c "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('nexus_conference_sessions','nexus_conference_speakers','nexus_conference_session_speakers')")" = "3"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO nexus_events(slug,title,starts_at,ends_at) VALUES ('ntc-synthetic','Synthetic NTC','2027-04-28T09:00:00-04:00','2027-04-30T18:00:00-04:00');"
          test "$(psql -At -c "SELECT publication_status FROM nexus_events WHERE slug='ntc-synthetic'")" = "draft"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO nexus_conference_sessions(event_id,slug,title,kind,starts_at,ends_at) SELECT id,'intro','Synthetic Session','workshop','2027-04-28T10:00:00-04:00','2027-04-28T11:00:00-04:00' FROM nexus_events WHERE slug='ntc-synthetic';"
          test "$(psql -At -c "SELECT count(*) FROM nexus_conference_sessions WHERE published=true")" = "0"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO nexus_conference_sessions(event_id,slug,title,kind,starts_at,ends_at) SELECT id,'invalid','Bad','workshop','2027-04-28T12:00:00-04:00','2027-04-28T11:00:00-04:00' FROM nexus_events WHERE slug='ntc-synthetic';"; then
            echo "Expected invalid session time rejection" >&2
            exit 1
          fi

      - name: Verify real concurrent event and workshop seat allocation
        env:
          CONFERENCE_TEST_DATABASE: '1'
        run: bash nexus/tests/conference-concurrency.sh

      - name: Verify Zeffy reconciliation, ticket replay and notification outbox
        run: psql -v ON_ERROR_STOP=1 -f nexus/tests/ticketing-integration.sql

      - name: Verify attendee capacity, promotions, consent and privacy
        run: psql -v ON_ERROR_STOP=1 -f nexus/tests/conference-integration.sql

      - name: Verify organizer authorization, scope and audit transactions
        run: psql -v ON_ERROR_STOP=1 -f nexus/tests/organizer-integration.sql

      - name: Verify atomic identity registration and conflict isolation
        run: |
          set -euo pipefail
          test "$(psql -At -c "SELECT kind FROM nexus_register_verified_identity('https://id.example.invalid','subject-1','alpha@example.invalid','Synthetic Alpha')")" = "created"
          test "$(psql -At -c "SELECT kind FROM nexus_register_verified_identity('https://id.example.invalid','subject-1','alpha@example.invalid','Synthetic Alpha')")" = "existing"
          test "$(psql -At -c "SELECT kind FROM nexus_register_verified_identity('https://id.example.invalid','subject-2','alpha@example.invalid','Synthetic Beta')")" = "email_conflict"
          test "$(psql -At -c "SELECT count(*) FROM nexus_external_identities WHERE issuer='https://id.example.invalid'")" = "1"
          test "$(psql -At -c "SELECT count(*) FROM nexus_members WHERE email_key='alpha@example.invalid' AND member_status='pending' AND directory_opt_in=false")" = "1"
          test "$(psql -At -c "SELECT count(*) FROM nexus_communication_preferences WHERE member_id IN (SELECT member_id FROM nexus_external_identities)")" = "0"

      - name: Verify Cloud Run state persistence and schema constraints
        run: |
          set -euo pipefail
          test "$(psql -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('nexus_runtime_tokens','nexus_runtime_rate_limits')")" = "2"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO nexus_runtime_tokens(token_hash,kind,expires_at) VALUES (repeat('a',64),'flow',now()+interval '5 minutes'), (repeat('b',64),'session',now()+interval '1 hour');"
          test "$(psql -At -c "WITH consumed AS (DELETE FROM nexus_runtime_tokens WHERE token_hash=repeat('a',64) AND kind='flow' AND expires_at>now() RETURNING token_hash) SELECT token_hash FROM consumed")" = "$(printf 'a%.0s' {1..64})"
          test "$(psql -At -c "SELECT count(*) FROM nexus_runtime_tokens WHERE token_hash=repeat('a',64)")" = "0"
          test "$(psql -At -c "SELECT count(*) FROM nexus_runtime_tokens WHERE token_hash=repeat('b',64) AND expires_at>now()")" = "1"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO nexus_runtime_tokens(token_hash,kind,expires_at) VALUES('raw-session-key','session',now())"; then
            echo "Expected raw token rejection" >&2
            exit 1
          fi
