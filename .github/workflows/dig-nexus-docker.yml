name: DIG Nexus Docker Compose
on:
  push:
    paths:
      - 'compose.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.env.example'
      - 'deploy/**'
      - 'nexus/docker/**'
      - 'nexus/cloud-run/**'
      - 'nexus/api/**'
      - 'nexus/schema-009-ticketing.sql'
      - 'nexus/schema-010-jobs.sql'
      - 'nexus/jobs/**'
      - 'release/**'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dig-nexus-docker.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.env.example'
      - 'deploy/**'
      - 'nexus/docker/**'
      - 'nexus/cloud-run/**'
      - 'nexus/api/**'
      - 'nexus/schema-009-ticketing.sql'
      - 'nexus/schema-010-jobs.sql'
      - 'nexus/jobs/**'
      - 'release/**'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dig-nexus-docker.yml'
permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Test runtime and trusted proxy
        run: node --test nexus/cloud-run/*.test.mjs nexus/docker/*.test.mjs nexus/jobs/*.test.mjs release/*.test.mjs
      - name: Start localhost-only Compose stack with synthetic secrets
        run: |
          set -euo pipefail
          install -d -m 700 deploy/secrets deploy/state/caddy-data deploy/state/caddy-config
          umask 077
          : > deploy/secrets/database_url
          : > deploy/secrets/google_client_secret
          : > deploy/secrets/google_session_secret
          : > deploy/secrets/zeffy_api_key
          : > deploy/secrets/zeffy_webhook_secret
          : > deploy/secrets/mailersend_api_token
          : > deploy/secrets/magic_link_session_secret
          openssl rand -hex 32 > deploy/secrets/proxy_token
          cat > .env <<EOV
          NEXUS_SITE_ADDRESS=http://localhost:18080
          NEXUS_PUBLIC_ORIGIN=https://localhost:18080
          GOOGLE_CLIENT_ID=
          GOOGLE_REDIRECT_URI=
          NEXUS_HTTP_BIND=127.0.0.1:18080:18080
          NEXUS_HTTPS_BIND=127.0.0.1:18443:443
          NEXUS_HTTPS_UDP_BIND=127.0.0.1:18443:443/udp
          NEXUS_IMAGE=dig-nexus:local
          NEXUS_UID=$(id -u)
          NEXUS_GID=$(id -g)
          EOV
          docker compose -p dig-nexus-ci config --quiet
          docker compose -p dig-nexus-ci up --build --wait -d
      - name: Check HTTP through Caddy and fail-closed writes
        run: |
          set -euo pipefail
          base=http://localhost:18080
          curl -fsS "$base/api/health" | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/portal")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/portal.css")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/enroll")" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/register")" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/ticketing/ntc/issue")" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/zeffy/webhook")" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/ticketing/ntc/checkin")" = 503
          # Browser-supplied proxy headers cannot bypass Caddy's overwrite.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Dig-Nexus-Proxy-Token: fake' \
            -H 'X-Dig-Nexus-Client-IP: 203.0.113.99' "$base/api/health")" = 200
          test "$(docker inspect dig-nexus-ci-nexus-1 --format '{{json .NetworkSettings.Ports}}' | grep -c '"8080/tcp":null')" = 1
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose -p dig-nexus-ci logs --tail 35 2>&1 | sed -E 's/[a-f0-9]{64}/[redacted]/g'
      - name: Remove smoke stack
        if: always()
        run: docker compose -p dig-nexus-ci down --remove-orphans --volumes

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Install isolated Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Clean-room browser and automated WCAG A/AA checks
        run: npx playwright test -c playwright.config.mjs

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: dig_nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dig_nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: dig_nexus
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply entire ordered DIG Nexus schema
        run: |
          set -euo pipefail
          for file in nexus/schema.sql nexus/schema-002-lifecycle.sql \
            nexus/schema-003-identities.sql nexus/schema-004-registration.sql \
            nexus/schema-005-conference.sql nexus/schema-006-organizer.sql \
            nexus/schema-007-attendee.sql nexus/schema-008-cloud-run-state.sql \
            nexus/schema-009-ticketing.sql nexus/schema-010-jobs.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file" > /dev/null
          done
      - name: Verify clean-room jobs and ticketing contracts
        run: psql -v ON_ERROR_STOP=1 -f nexus/tests/jobs-integration.sql
      - name: Verify existing event lifecycle and privacy contracts
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f nexus/tests/conference-integration.sql
          psql -v ON_ERROR_STOP=1 -f nexus/tests/organizer-integration.sql
          psql -v ON_ERROR_STOP=1 -f nexus/tests/ticketing-integration.sql

  publish:
    needs: [docker, browser, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-pinned Docker image (no server deployment)
        id: publish_image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Sign immutable image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.publish_image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${{ github.repository }}@$IMAGE_DIGEST"
      - name: Independently verify signer identity and immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.publish_image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/dig-nexus-docker.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}@$IMAGE_DIGEST" > /dev/null
