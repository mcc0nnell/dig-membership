name: DIG Nexus checks
on:
  push:
    paths:
      - 'nexus/**'
      - 'package.json'
      - 'package-lock.json'
      - 'newsletter/**'
      - '.github/workflows/dig-nexus.yml'
  pull_request:
    paths:
      - 'nexus/**'
      - 'package.json'
      - 'package-lock.json'
      - 'newsletter/**'
      - '.github/workflows/dig-nexus.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run isolated unit tests (no credentials)
        run: node --test nexus/*.test.mjs nexus/api/worker.test.mjs nexus/api/agenda-db.test.mjs nexus/api/agenda-http.test.mjs nexus/api/agenda-page.test.mjs nexus/api/organizer-db.test.mjs nexus/api/organizer.test.mjs nexus/api/organizer-http.test.mjs nexus/api/organizer-page.test.mjs nexus/api/registration.test.mjs nexus/api/registration-http.test.mjs nexus/api/registration-db.test.mjs nexus/api/oidc.test.mjs nexus/api/database.test.mjs nexus/api/member-http.test.mjs nexus/api/google-auth.test.mjs nexus/api/member-journey.test.mjs newsletter/*.test.mjs

      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run --config nexus/wrangler.jsonc
