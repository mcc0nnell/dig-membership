name: DIG Nexus checks
on:
  push:
    paths:
      - 'nexus/**'
      - 'newsletter/**'
      - '.github/workflows/dig-nexus.yml'
  pull_request:
    paths:
      - 'nexus/**'
      - 'newsletter/**'
      - '.github/workflows/dig-nexus.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated unit tests (no credentials)
        run: node --test nexus/*.test.mjs nexus/api/worker.test.mjs nexus/api/registration.test.mjs nexus/api/registration-http.test.mjs newsletter/*.test.mjs
