name: dig-nexus
services:
  nexus:
    # Match the host owner of chmod 0600 Compose secret files; do not run as root.
    user: "${NEXUS_UID:?Set a non-root numeric UID}:${NEXUS_GID:?Set a non-root numeric GID}"
    image: ${NEXUS_IMAGE:-dig-nexus:local}
    build:
      context: .
    # Compose selects the hardened trusted-Caddy entry point.
    command: ["node", "nexus/docker/server.mjs"]
    environment:
      PORT: "8080"
      PUBLIC_ORIGIN: ${NEXUS_PUBLIC_ORIGIN:?Set NEXUS_PUBLIC_ORIGIN in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      DATABASE_URL_FILE: /run/secrets/database_url
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_SESSION_SECRET_FILE: /run/secrets/google_session_secret
      NEXUS_PROXY_TOKEN_FILE: /run/secrets/proxy_token
      REGISTRATION_ENABLED: "false"
      MEMBER_ENROLLMENT_ENABLED: "false"
      ORGANIZER_ENABLED: "false"
      CONSTITUENTS_ENABLED: "false"
      CAMPAIGNS_ENABLED: "false"
      NEWSLETTER_UNSUBSCRIBE_ENABLED: "false"
      CONFERENCE_REGISTRATION_ENABLED: "false"
      NTC_TICKETING_ENABLED: "false"
      NTC_TICKETS_ENABLED: "false"
      NTC_CHECKIN_ENABLED: "false"
      NTC_ZEFFY_WEBHOOK_ENABLED: "false"
      MAGIC_LINK_ENABLED: "false"
      MAGIC_LINK_EMAIL_ENABLED: "false"
      MAGIC_LINK_SESSION_SECRET_FILE: /run/secrets/magic_link_session_secret
      MAILERSEND_API_TOKEN_FILE: /run/secrets/mailersend_api_token
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-}
      ZEFFY_API_KEY_FILE: /run/secrets/zeffy_api_key
      ZEFFY_WEBHOOK_SECRET_FILE: /run/secrets/zeffy_webhook_secret
    secrets:
      - database_url
      - google_client_secret
      - google_session_secret
      - proxy_token
      - zeffy_api_key
      - zeffy_webhook_secret
      - magic_link_session_secret
      - mailersend_api_token
    expose:
      - "8080"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "nexus/docker/healthcheck.mjs"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  jobs:
    profiles: ["jobs"]
    image: ${NEXUS_IMAGE:-dig-nexus:local}
    user: "${NEXUS_UID:?Set a non-root numeric UID}:${NEXUS_GID:?Set a non-root numeric GID}"
    # Only execute against an explicitly prepared staging branch; never default-on.
    command: ["node", "nexus/jobs/runner.mjs"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NEXUS_JOB_WORKER_ENABLED: "false"
    secrets:
      - database_url
    networks:
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    restart: "no"

  mailer:
    profiles: [mailer]
    user: "${NEXUS_UID:?Set a non-root numeric UID}:${NEXUS_GID:?Set a non-root numeric GID}"
    image: ${NEXUS_IMAGE:-dig-nexus:local}
    build:
      context: .
    command: ["node", "nexus/docker/dispatch-mail.mjs"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NEXUS_PROXY_TOKEN_FILE: /run/secrets/proxy_token
      MAILERSEND_API_TOKEN_FILE: /run/secrets/mailersend_api_token
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-}
      MAILERSEND_FROM_NAME: ${MAILERSEND_FROM_NAME:-Deaf in Government}
      DIG_TRANSACTIONAL_EMAIL_ENABLED: "false"
      MAILER_MODE: ${MAILER_MODE:-once}
      MAILER_INTERVAL_SECONDS: ${MAILER_INTERVAL_SECONDS:-60}
    secrets:
      - database_url
      - proxy_token
      - mailersend_api_token
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m

  caddy:
    user: "${NEXUS_UID:?Set a non-root numeric UID}:${NEXUS_GID:?Set a non-root numeric GID}"
    image: caddy:2.10.2-alpine
    depends_on:
      nexus:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    environment:
      NEXUS_SITE_ADDRESS: ${NEXUS_SITE_ADDRESS:?Set NEXUS_SITE_ADDRESS in .env}
    ports:
      - "${NEXUS_HTTP_BIND:-80:80}"
      - "${NEXUS_HTTPS_BIND:-443:443}"
      - "${NEXUS_HTTPS_UDP_BIND:-443:443/udp}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - ./deploy/state/caddy-data:/data
      - ./deploy/state/caddy-config:/config
    secrets:
      - proxy_token
    networks:
      - backend
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  backend: {}

secrets:
  database_url:
    file: ./deploy/secrets/database_url
  google_client_secret:
    file: ./deploy/secrets/google_client_secret
  google_session_secret:
    file: ./deploy/secrets/google_session_secret
  proxy_token:
    file: ./deploy/secrets/proxy_token
  zeffy_api_key:
    file: ./deploy/secrets/zeffy_api_key
  zeffy_webhook_secret:
    file: ./deploy/secrets/zeffy_webhook_secret
  mailersend_api_token:
    file: ./deploy/secrets/mailersend_api_token
  magic_link_session_secret:
    file: ./deploy/secrets/magic_link_session_secret
